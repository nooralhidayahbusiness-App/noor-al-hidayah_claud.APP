name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # مفتاح Gemini فقط (لا نضع أي مفتاح سري آخر داخل التطبيق)
      - name: Create secrets.dart
        run: |
          cat > lib/core/secrets.dart << 'SECRETS'
          const String geminiApiKey = '${{ secrets.GEMINI_API_KEY }}';
          const String geminiEndpoint = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent';
          SECRETS

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/noor-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << PROPS
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/noor-release.jks
          PROPS

      # ملفات الأذان: المكان الصحيح assets/audio/adhan (ينسخ من المجلد القديم إن وُجد)
      - name: Prepare adhan audio
        run: |
          mkdir -p assets/audio/adhan
          for d in ./*" assets"; do
            if [ -d "$d/audio/adhan" ]; then
              cp -r "$d/audio/adhan/." assets/audio/adhan/
            fi
          done
          rm -f assets/audio/adhan/readme.txt
          echo "Adhan files: $(ls assets/audio/adhan | wc -l)"

      # ملفات Java: النسخة الجديدة قد تكون داخل ملف .txt (حماية من أخطاء الرفع)
      - name: Prepare native files
        run: |
          J=android/app/src/main/java/com/nooralhidayah/noor_al_hidayah
          K=android/app/src/main/kotlin/com/nooralhidayah/noor_al_hidayah
          rm -f $K/*.java $K/*.java.txt
          if [ -f $J/PrayerCountdown.java.txt ]; then
            mv -f $J/PrayerCountdown.java.txt $J/PrayerCountdown.java
          fi
          rm -f $J/PrayerCountdownReceiver.java.txt
          ls $J $K

      - run: flutter pub get

      # النسخة الرئيسية: تدعم هواتف 64-بت و 32-بت (arm + arm64) في ملف واحد
      - name: Build release APK (arm + arm64)
        run: flutter build apk --release --target-platform android-arm,android-arm64 --no-tree-shake-icons

      - name: Collect main APK
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-release.apk "out/NoorAlHidayah-$VER.apk"

      # نسخة تجريبية: نفس التطبيق لكن بدون Impeller (محرك الرسم الجديد) — لتشخيص هواتف قديمة
      - name: Build test APK without Impeller
        run: |
          sed -i 's#</application>#    <meta-data android:name="io.flutter.embedding.android.EnableImpeller" android:value="false" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "EnableImpeller" android/app/src/main/AndroidManifest.xml
          flutter build apk --release --target-platform android-arm,android-arm64 --no-tree-shake-icons

      - name: Collect test APK
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "out/NoorAlHidayah-$VER-skia-test.apk"
          (cd out && sha256sum *.apk > SHA256.txt && cat SHA256.txt && ls -lh)

      - uses: actions/upload-artifact@v4
        with:
          name: noor-al-hidayah-apk
          path: out/*
          retention-days: 30
