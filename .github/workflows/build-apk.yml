name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create secrets.dart
        run: |
          cat > lib/core/secrets.dart << 'SECRETS'
          const String geminiApiKey = '${{ secrets.GEMINI_API_KEY }}';
          const String geminiEndpoint = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent';
          const String oneSignalRestApiKey = '${{ secrets.ONESIGNAL_API_KEY }}';
          SECRETS

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/noor-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << PROPS
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=/tmp/noor-release.jks
          PROPS

      # ✅ ينسخ ملفات الأذان من المجلد المرفوع بالخطأ (الاسم assets) إلى assets/audio/adhan
      - name: Prepare adhan audio
        run: |
          mkdir -p assets/audio/adhan
          for d in ./*" assets"; do
            if [ -d "$d/audio/adhan" ]; then
              cp -r "$d/audio/adhan/." assets/audio/adhan/
            fi
          done
          rm -f assets/audio/adhan/readme.txt
          echo "Adhan files:"
          ls -la assets/audio/adhan

      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: noor-al-hidayah-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
